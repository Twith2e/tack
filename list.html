<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="list.css" />
        <title>Notes</title>
    </head>
    <body class="list-window">
        <header class="titlebar">
            <div class="actions actions-start">
                <button id="new-note" class="icon-btn" title="New note" aria-label="New note">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                </button>
                <button id="open-settings" class="icon-btn" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <span id="view-title" class="titlebar-title">Notes</span>
            <div class="actions actions-end">
                <button id="close-note" class="icon-btn" title="Close" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>

        <section id="notes-view" class="view">
            <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />
                </svg>
                <input id="search" type="search" placeholder="Search notes" autocomplete="off" />
            </div>
            <main id="notes"></main>
        </section>

        <section id="settings-view" class="view" hidden>
            <div class="settings">
                <button id="back-to-notes" class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                    Notes
                </button>

                <h2 class="settings-heading">Theme</h2>
                <div class="segmented" role="radiogroup" aria-label="Theme">
                    <label><input type="radio" name="theme" value="system" /><span>System</span></label>
                    <label><input type="radio" name="theme" value="light" /><span>Light</span></label>
                    <label><input type="radio" name="theme" value="dark" /><span>Dark</span></label>
                </div>
                <p class="settings-hint">System follows your operating system's appearance.</p>
            </div>
        </section>
    </body>
    <script src="chrome.js"></script>
    <script src="list.js"></script>
</html>
