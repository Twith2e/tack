<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <meta
            http-equiv="X-Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Tack</title>
    </head>
    <body class="loading">
        <header class="titlebar">
            <div class="actions actions-start">
                <button id="new-note" class="icon-btn" title="New note" aria-label="New note">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                </button>
            </div>
            <div class="actions actions-end">
                <button id="note-menu" class="icon-btn" title="Menu" aria-label="Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="1" />
                        <circle cx="19" cy="12" r="1" />
                        <circle cx="5" cy="12" r="1" />
                    </svg>
                </button>
                <button id="close-note" class="icon-btn" title="Close" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </header>
        <main id="note-ui">
            <div id="note" contenteditable="false" role="textbox" aria-multiline="true" spellcheck="true"></div>
            <div class="loader" role="status" aria-label="Loading note">
                <span class="spinner"></span>
            </div>
        </main>
        <footer>
            <div id="note-toolbar">
                <button data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8" />
                    </svg>
                </button>
                <button data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" x2="10" y1="4" y2="4" />
                        <line x1="14" x2="5" y1="20" y2="20" />
                        <line x1="15" x2="9" y1="4" y2="20" />
                    </svg>
                </button>
                <button data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 4v6a6 6 0 0 0 12 0V4" />
                        <line x1="4" x2="20" y1="20" y2="20" />
                    </svg>
                </button>
                <button data-cmd="strikeThrough" title="Strikethrough (Ctrl+T)" aria-label="Strikethrough">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 4H9a3 3 0 0 0-2.83 4" />
                        <path d="M14 12a4 4 0 0 1 0 8H6" />
                        <line x1="4" x2="20" y1="12" y2="12" />
                    </svg>
                </button>
                <button data-cmd="insertUnorderedList" title="Bullet list" aria-label="Bullet list">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 5h.01" />
                        <path d="M3 12h.01" />
                        <path d="M3 19h.01" />
                        <path d="M8 5h13" />
                        <path d="M8 12h13" />
                        <path d="M8 19h13" />
                    </svg>
                </button>
                <span id="save-status" class="save-status" role="status" aria-live="polite">
                    <span class="spinner"></span>
                    <span id="save-label"></span>
                </span>
            </div>
        </footer>
        <div id="menu" class="menu" role="menu" hidden>
            <div class="swatches" role="radiogroup" aria-label="Note color">
                <button class="swatch" role="radio" data-color="yellow" title="Yellow" aria-label="Yellow"></button>
                <button class="swatch" role="radio" data-color="green" title="Green" aria-label="Green"></button>
                <button class="swatch" role="radio" data-color="pink" title="Pink" aria-label="Pink"></button>
                <button class="swatch" role="radio" data-color="purple" title="Purple" aria-label="Purple"></button>
                <button class="swatch" role="radio" data-color="blue" title="Blue" aria-label="Blue"></button>
                <button class="swatch" role="radio" data-color="gray" title="Gray" aria-label="Gray"></button>
                <button class="swatch" role="radio" data-color="charcoal" title="Charcoal" aria-label="Charcoal"></button>
            </div>
            <button id="menu-notes-list" class="menu-item" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 5h.01" />
                    <path d="M3 12h.01" />
                    <path d="M3 19h.01" />
                    <path d="M8 5h13" />
                    <path d="M8 12h13" />
                    <path d="M8 19h13" />
                </svg>
                <span class="menu-label">Notes list</span>
            </button>
            <button id="menu-pin" class="menu-item" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 17v5" />
                    <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
                </svg>
                <span class="menu-label">Always on top</span>
            </button>
            <div class="menu-separator" role="separator"></div>
            <button id="menu-delete" class="menu-item danger" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                    <path d="M3 6h18" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
                <span class="menu-label">Delete note</span>
            </button>
        </div>
    </body>
    <script src="chrome.js"></script>
    <script src="renderer.js"></script>
</html>
